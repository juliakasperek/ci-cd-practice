name: CI #shows up in GitHub's Actions tab
on: [push] # When to run: on push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # to make every version run even when one fails
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest
      - name: Run linter
        run: ruff check